# Config-Driven OpenAPI Contract Monitoring Engine (POC)
# Manual trigger, parameter: product (e.g. vera)

trigger: none
pr: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  nodeVersion: '20.x'

stages:
  - stage: Monitor
    displayName: 'API Contract Monitor'
    jobs:
      - job: RunMonitor
        displayName: 'Run Contract Monitor'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Use Node $(nodeVersion)'

          - script: |
              npm ci
            displayName: 'npm install'

          - script: |
              export PRODUCT=$(Product)
              export GITHUB_TOKEN=$(GITHUB_TOKEN)
              CONFIG=$(node scripts/validate-config.js)
              SPEC=$(node scripts/fetch-spec.js "$CONFIG")
              NORMALIZED=$(node scripts/normalize-spec.js "$SPEC")
              DIFF=$(node scripts/run-diff.js "$NORMALIZED")
              node scripts/filter-diff.js "$DIFF"
            displayName: 'Run pipeline (validate, fetch, normalize, diff, filter)'
            env:
              Product: $(Product)
            continueOnError: true

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: 'contracts/diff-reports'
              artifactName: 'diff-reports-$(Product)'
              publishLocation: 'pipeline'
            displayName: 'Publish diff reports'

parameters:
  - name: Product
    displayName: 'Product to monitor'
    type: string
    default: 'vera'
