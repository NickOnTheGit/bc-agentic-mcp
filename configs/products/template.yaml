# Template for product configuration
# Copy and adapt for each API you monitor

# Option A: Fetch from repo file (when releases have no assets)
# productId: example
# specSource:
#   type: github_repo
#   repo: owner/repo-name
#   branch: main
#   path: openapi.yaml

# Option B: Fetch from release assets
productId: example
specSource:
  type: github_release
  repo: owner/repo-name
  releaseStrategy: latest
  assetRegex: ".*\\.(ya?ml|json)$"
normalize:
  enabled: true
  tool: redocly
usageMapPath: contracts/usage-maps/example.json
