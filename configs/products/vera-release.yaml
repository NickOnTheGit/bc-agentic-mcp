# VERA OpenAPI - fetch from release assets (use if releases include OpenAPI files)
productId: vera
specSource:
  type: github_release
  repo: Aedes-datastandaarden/vera-openapi
  releaseStrategy: latest
  assetRegex: ".*\\.(ya?ml|json)$"
normalize:
  enabled: true
  tool: redocly
usageMapPath: contracts/usage-maps/vera.json
